<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoStream - الدخول والتسجيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f4f7f9] min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 md:p-10 flex flex-col items-center">
        
        <div class="w-16 h-16 bg-[#eef2f6] text-[#1e293b] font-bold text-xl rounded-full flex items-center justify-center mb-6 shadow-inner">
            E
        </div>

        <h1 id="page-title" class="text-2xl md:text-3xl font-bold text-[#0f172a] text-center mb-2">Welcome to EchoStream</h1>
        <p id="page-subtitle" class="text-sm text-[#64748b] text-center mb-8">Sign in to continue</p>

        <button id="google-btn" type="button" class="w-full flex items-center justify-center gap-3 border border-[#e2e8f0] hover:bg-gray-50 text-[#334155] font-medium py-3 px-4 rounded-xl transition duration-200 mb-6">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.103C18.22 1.824 15.48.96 12.24.96c-6.085 0-11 4.915-11 11s4.915 11 11 11c6.353 0 10.573-4.464 10.573-10.76 0-.726-.077-1.282-.175-1.915H12.24z"/>
            </svg>
            <span class="text-sm">Continue with Google</span>
        </button>

        <div class="w-full flex items-center my-2">
            <div class="flex-grow border-t border-[#e2e8f0]"></div>
            <span class="mx-4 text-xs font-semibold text-[#94a3b8] tracking-wider">OR</span>
            <div class="flex-grow border-t border-[#e2e8f0]"></div>
        </div>

        <div id="message-box" class="w-full text-center text-xs p-3 rounded-xl hidden my-2"></div>

        <form id="auth-form" class="w-full space-y-5 mt-4">
            <div>
                <label class="block text-xs font-semibold text-[#475569] text-left mb-2" dir="ltr">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#94a3b8]">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" placeholder="you@example.com" dir="ltr" required
                           class="w-full pl-11 pr-4 py-3 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-sm focus:outline-none focus:border-[#0f172a] focus:bg-white transition text-[#334155]">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-[#475569] text-left mb-2" dir="ltr">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#94a3b8]">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" placeholder="••••••••" dir="ltr" required
                           class="w-full pl-11 pr-4 py-3 bg-[#f8fafc] border border-[#e2e8f0] rounded-xl text-sm focus:outline-none focus:border-[#0f172a] focus:bg-white transition text-[#334155]">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-[#0f172a] hover:bg-[#1e293b] text-white font-medium py-3 rounded-xl transition shadow-md text-sm">
                Sign in
            </button>
        </form>

        <div class="w-full flex items-center justify-between mt-8 text-xs font-medium">
            <a href="#" id="forgot-link" class="text-[#64748b] hover:text-[#0f172a]">Forgot password?</a>
            <div id="toggle-text" class="text-[#64748b]">
                Need an account? <a href="#" id="toggle-auth" class="text-[#0f172a] font-bold hover:underline">Sign up</a>
            </div>
        </div>

    </div>

    <script>
        // بيانات الربط الأساسية لمشروع Supabase الخاص بك
        const SUPABASE_URL = "https://ozztsleapvqwdqqyfsiz.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_P7EDU-S3M3I30-rlL_ZP6g_qDJSa2iw"; 

        // إنشاء كائن الاتصال باسم فريد لمنع تكرار التعريف المتسبب في خطأ الـ Console السابق
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignInMode = true;

        const authForm = document.getElementById('auth-form');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const messageBox = document.getElementById('message-box');
        const googleBtn = document.getElementById('google-btn');

        document.getElementById('forgot-link').addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('ميزة استعادة كلمة المرور ستفعل قريباً', 'bg-blue-50 text-blue-700');
        });

        function setupToggle() {
            const toggleLink = document.getElementById('toggle-auth');
            if (toggleLink) {
                toggleLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    isSignInMode = !isSignInMode;
                    
                    if (isSignInMode) {
                        pageTitle.innerText = "Welcome to EchoStream";
                        pageSubtitle.innerText = "Sign in to continue";
                        submitBtn.innerText = "Sign in";
                        toggleText.innerHTML = `Need an account? <a href="#" id="toggle-auth" class="text-[#0f172a] font-bold hover:underline">Sign up</a>`;
                    } else {
                        pageTitle.innerText = "Create an Account";
                        pageSubtitle.innerText = "Sign up to start your journey";
                        submitBtn.innerText = "Sign up";
                        toggleText.innerHTML = `Already have an account? <a href="#" id="toggle-auth" class="text-[#0f172a] font-bold hover:underline">Sign in</a>`;
                    }
                    setupToggle();
                });
            }
        }
        setupToggle();

        // نظام التسجيل والولوج عبر البريد الإلكتروني والرمز السري
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            showMessage('جاري المعالجة...', 'bg-blue-50 text-blue-700');

            try {
                if (isSignInMode) {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showMessage('تم تسجيل الدخول بنجاح!', 'bg-green-50 text-green-700');
                } else {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    showMessage('تم إنشاء الحساب! تفقد بريدك الإلكتروني لتفعيله.', 'bg-green-50 text-green-700');
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showMessage(error.message, 'bg-red-50 text-red-700');
            }
        });

        // نظام تسجيل الدخول بواسطة حساب قوقل
        googleBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            showMessage('جاري الاتصال بجوجل...', 'bg-blue-50 text-blue-700');
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        // تحديد مسار مجلد الـ GitHub Pages الدقيق ليعود إليه المتصفح مباشرة بعد تفويض قوقل
                        redirectTo: "https://x32sadfasf.github.io/website/"
                    }
                });
                if (error) throw error;
            } catch (error) {
                console.error("Google Auth Error:", error);
                showMessage("فشل الاتصال بجوجل: " + error.message, 'bg-red-50 text-red-700');
            }
        });

        function showMessage(text, classes) {
            messageBox.innerText = text;
            messageBox.className = `w-full text-center text-xs p-3 rounded-xl my-2 ${classes}`;
            messageBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
